name: on-pull-request
run-name: on pull request activity

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - closed

# a new push to a PR cancels the stale preview build for that PR
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-citations:
    uses: ./.github/workflows/update-citations.yaml

  build-preview:
    needs: update-citations
    uses: ./.github/workflows/build-preview.yaml
